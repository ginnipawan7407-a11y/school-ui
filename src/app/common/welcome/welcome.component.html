<section class="welcome-panel">
  <div class="welcome-copy">
    <div class="welcome-school"><img [src]="school().welcomeLogo || defaultLogo" [alt]="school().name + ' logo'" (error)="useDefaultLogo($event)"><p class="eyebrow">{{ school().name }}</p></div>
    <h1>Make today <em>count.</em></h1>
    <p class="welcome-text">{{ welcomeMessage }}</p>
  </div>
  <div class="campus-illustration" aria-hidden="true">
    <span class="sun"></span><span class="hill hill-back"></span><span class="hill hill-front"></span>
    <span class="building"><i></i><i></i><i></i><b></b></span>
    <span class="tree tree-one"></span><span class="tree tree-two"></span>
  </div>
</section>
